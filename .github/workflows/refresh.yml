name: Refresh V11 vs V12 capture
run-name: ${{ inputs.reason || github.event.head_commit.message || 'Refresh V11 vs V12 capture' }}

# Runs when watch-releases.yml sees a new Carbon release (V12 alpha from `next`, or a stable
# V11 release), every other Thursday around 7:30pm US Eastern as a fallback, on any push to
# main that changes the site or the capture/diff scripts, and from the "Run workflow" button.
# GitHub cron is UTC and has no "every two weeks", so this fires weekly and the first
# step skips odd weeks. 23:30 UTC is 7:30pm EDT (6:30pm EST in winter). GitHub can
# start scheduled runs late during busy periods.
on:
  schedule:
    - cron: '30 23 * * 4'
  workflow_dispatch:
    inputs:
      v12_release:
        description: 'V12 release being captured (e.g. v12.0.0-alpha.10). Set by watch-releases.yml.'
        required: false
      v11_release:
        description: 'V11 release being captured (e.g. v11.120.0). Set by watch-releases.yml.'
        required: false
      reason:
        description: 'Why this run was started (shown as the run name)'
        required: false
  push:
    branches: [main]
    # The bot's own changelog commits only touch data/, so they don't retrigger this.
    paths:
      - site/**
      - package.json
      - package-lock.json
      - capture.mjs
      - diff.mjs

permissions:
  contents: write   # commit the refreshed changelog
  pages: write
  id-token: write
  actions: write    # delete superseded capture caches

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The npm dist-tag the site itself follows. Carbon publishes V12 alphas under v12-alpha;
      # switch this when betas get their own tag.
      CARBON_DIST_TAG: v12-alpha
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Every other week
        id: gate
        run: |
          # Epoch weeks start Thursday 00:00 UTC; even weeks run (the first was 2026-09-24).
          week=$(( $(date +%s) / 604800 ))
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((week % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Odd week ($week); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Previous run's raw captures and screenshots, so unchanged Storybook builds are skipped.
      - name: Restore previous capture
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/stories
            data/shots
          key: capture-${{ github.run_id }}
          restore-keys: capture-

      - name: Capture
        if: steps.gate.outputs.run == 'true'
        # Releases and pushes use the render check (only stories that actually rendered differently
        # are fully recaptured). The every-other-Thursday run recaptures everything as a safety net.
        run: node capture.mjs --concurrency 6 ${{ github.event_name == 'schedule' && '--force' || '' }}
        env:
          # Recorded in data/meta.json so the watcher knows what's been captured and the site can show it.
          V12_RELEASE: ${{ inputs.v12_release }}
          V11_RELEASE: ${{ inputs.v11_release }}

      - name: Diff
        if: steps.gate.outputs.run == 'true'
        run: node diff.mjs

      - name: Save capture
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/stories
            data/shots
          key: capture-${{ github.run_id }}

      # Each run saves a new cache entry and only the newest is ever restored, so drop the older
      # ones rather than letting them sit until GitHub evicts them after 7 days.
      - name: Delete older capture caches
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="capture-${{ github.run_id }}"
          caches=$(gh api "repos/${{ github.repository }}/actions/caches?key=capture-&per_page=100" --paginate \
            --jq '.actions_caches[] | "\(.id) \(.key)"')
          # Never delete the older ones unless this run's entry was actually saved.
          if ! grep -q " $keep$" <<<"$caches"; then echo "New cache not found; keeping the old ones."; exit 0; fi
          while read -r id key; do
            if [ "$key" != "$keep" ]; then
              echo "Deleting $key"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
            fi
          done <<<"$caches"

      # The site is built with @carbon/react itself. Move it to the newest release on CARBON_DIST_TAG,
      # but only keep the upgrade if the site still builds; otherwise stay put and flag the run.
      - name: Build site on the latest Carbon release
        id: site
        if: steps.gate.outputs.run == 'true'
        run: |
          current=$(node -p 'require("./package.json").dependencies["@carbon/react"]')
          latest=$(npm view "@carbon/react@$CARBON_DIST_TAG" version)
          echo "Site uses @carbon/react $current; $CARBON_DIST_TAG is $latest."
          if [ "$latest" != "$current" ]; then
            npm install --save-exact "@carbon/react@$latest"
            if npm run build; then
              echo "upgraded=$latest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=Carbon upgrade failed::The site doesn't build with @carbon/react $latest; it stays on $current."
            git checkout -- package.json package-lock.json
            npm ci
          fi
          npm run build

      # Only the small text outputs go into git (plus the Carbon version bump, when there is one).
      - name: Commit changelog
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/CHANGELOG.md package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changelog changes."
          else
            msg="Refresh V11 vs V12 capture ($(date -u +%Y-%m-%d))"
            [ -n "${{ steps.site.outputs.upgraded }}" ] && msg="$msg; site on @carbon/react ${{ steps.site.outputs.upgraded }}"
            git commit -m "$msg"
            git push
          fi

      - name: Assemble site
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p _site/data
          cp -r dist/. _site/
          cp .nojekyll _site/
          cp data/*.json data/CHANGELOG.md _site/data/
          cp -r data/shots _site/data/shots

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site
      - name: Deploy
        id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
